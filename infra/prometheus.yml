global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'bsconnect'

scrape_configs:

  - job_name: 'api'
    static_configs:
      - targets: ['api:8080']
    metrics_path: '/metrics'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:9113']   # nginx prometheus exporter if added later

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
